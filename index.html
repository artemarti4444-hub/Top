<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Топ порноактрис</title>
<meta name="theme-color" content="#0e0f13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
:root{--bg:#0e0f13;--card:#171923;--card2:#1f2230;--txt:#e8e9ee;--dim:#8a8fa3;--acc:#2f7bff;--ok:#3ddc84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,Roboto,"Segoe UI",Arial,sans-serif;padding-bottom:80px}
header{padding:14px 14px 8px;position:sticky;top:0;background:rgba(14,15,19,.97);backdrop-filter:blur(10px);z-index:5;border-bottom:1px solid #22252f}
h1{margin:0 0 8px;font-size:19px;display:flex;align-items:center;gap:8px;min-width:0}
#ttl{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;cursor:text}
.pencil{flex:0 0 auto;width:27px;height:27px;border-radius:8px;background:var(--card2);color:var(--dim);border:1px solid #2b2f3d;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0}
.pencil:active{background:var(--acc);color:#fff;border-color:var(--acc)}
.ttl-inp{flex:1 1 auto;min-width:0;font:700 17px/1.3 inherit;color:#fff;background:#12141c;border:1px solid var(--acc);border-radius:10px;padding:5px 9px;outline:none}
input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2b2f3d;background:#12141c;color:var(--txt);font-size:16px;outline:none}
input[type=search]:focus{border-color:var(--acc)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:99px;background:var(--card2);color:var(--dim);font-size:13px;border:1px solid #2b2f3d}
main{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;overflow-anchor:none}
.card{background:var(--card);border:1px solid #22252f;border-radius:0;overflow:hidden;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .12s ease,opacity .12s ease}
.card.press{transform:scale(.97);opacity:.9}
.card.dragging{position:fixed;z-index:60;pointer-events:none;transition:none!important;will-change:transform;border-color:transparent;opacity:.98;box-shadow:0 0 0 2px var(--acc),0 18px 42px rgba(0,0,0,.7)}
.ph{border-radius:0;background:rgba(47,123,255,.10);border:2px dashed rgba(47,123,255,.55);pointer-events:none}
body.dragging-mode{cursor:grabbing}
.num.drag{border:1px solid var(--acc)}
.shot{aspect-ratio:3/4;background:linear-gradient(145deg,#2a2f42,#14161f);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.shot img,.shot video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.badge{position:absolute;right:6px;top:60px;background:rgba(0,0,0,.72);color:#fff;font-size:10px;padding:3px 7px;border-radius:99px;letter-spacing:.3px}
.ini{font-size:32px;font-weight:700;color:#3d4358}
.size{position:absolute;right:0;bottom:0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82);font-size:12px;font-weight:700;padding:0;border-radius:0;color:#3ddc84}
.body{padding:9px 10px 12px}
.name{font-size:15px;font-weight:600;margin-bottom:3px;line-height:1.2}
.meta{color:var(--dim);font-size:12px;margin-bottom:6px}
.nat{color:var(--ok)}
.tlist{display:flex;flex-wrap:wrap;gap:4px}
.mini{font-size:11px;color:#b6bbcd;background:#20242f;padding:2px 7px;border-radius:6px}
.note{margin-top:7px;font-size:12px;color:#a9aec0;font-style:italic}
.flagSel{position:absolute;top:0;right:0;z-index:4;width:55px;height:55px;padding:0;border-radius:0 0 0 14px;background-color:rgba(0,0,0,.82);background-size:100% 100%;background-position:center;background-repeat:no-repeat;border:0;border-left:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);color:#fff;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);cursor:pointer}
.flagSel{overflow:hidden}.flagSel:active{background:var(--acc);border-color:var(--acc)}
.flagWrap{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.flagWrap.open{display:flex}
.flagPanel{width:min(620px,100%);max-height:80vh;background:#12141c;border:1px solid #22252f;border-radius:16px 16px 0 0;padding:14px;display:flex;flex-direction:column;gap:10px}
.flagTop{display:flex;align-items:center;gap:10px}
.flagTop h3{margin:0;font-size:16px;color:#fff;flex:0 0 auto}
#flagSearch{flex:1 1 auto;min-width:0;background:#0d0f16;border:1px solid #2b2f3d;border-radius:10px;color:#e8e9ee;font:400 14px inherit;padding:8px 11px;outline:none}
#flagSearch:focus{border-color:var(--acc)}
#flagGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;overflow:auto;padding:2px 4px 8px 0}
.fo{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid #262a37;border-radius:10px;padding:8px 10px;color:#e8e9ee;font:400 13px inherit;text-align:left;cursor:pointer}
.fo b{font-size:19px;line-height:1}
.fo.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.fo.none{grid-column:1/-1;justify-content:center;color:#8a8fa3}
.num{position:absolute;left:0;bottom:0;width:38px;height:38px;padding:0;border-radius:0;background:rgba(0,0,0,.82);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.del{position:absolute;left:7px;top:7px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.empty{padding:40px 16px;color:var(--dim);text-align:center;grid-column:1/-1;line-height:1.6}
.fab{position:fixed;right:18px;bottom:22px;width:60px;height:60px;border-radius:50%;background:#2f7bff;color:#fff;border:0;font-size:32px;line-height:1;box-shadow:0 8px 24px rgba(47,123,255,.45);z-index:20}
.fab:active{transform:scale(.94)}
.fab2{left:18px;right:auto;background:#1f2230;color:#fff;font-size:26px;box-shadow:0 8px 24px rgba(0,0,0,.5);border:1px solid #2b2f3d}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#2f7bff;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:40;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;align-items:flex-end}
.sheet.on{display:flex}
.panel{background:#15171f;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 24px;border-top:1px solid #2b2f3d}
.panel h2{margin:0 0 14px;font-size:17px}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
input[type=text],textarea{width:100%;padding:12px;border-radius:11px;border:1px solid #2b2f3d;background:#12141c;color:var(--txt);font-size:16px;font-family:inherit;outline:none}
textarea{resize:vertical;min-height:60px}
input[type=text]:focus,textarea:focus{border-color:var(--acc)}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sz{width:42px;height:42px;border-radius:11px;background:var(--card2);color:var(--dim);border:1px solid #2b2f3d;font-size:15px}
.sz.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px;border-radius:12px;border:0;font-size:16px;font-weight:600}
.save{background:var(--acc);color:#fff}
.cancel{background:var(--card2);color:var(--dim)}
.srcWrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.srcWrap.open{display:flex}
.srcPanel{width:min(560px,100%);background:#12141c;border:1px solid #22252f;border-radius:16px 16px 0 0;padding:16px 14px 22px;display:flex;flex-direction:column;gap:9px}
.srcPanel h3{margin:0 0 4px;font-size:16px;color:#fff;text-align:center}
.srcBtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.srcBtn{position:relative;display:flex;align-items:center;gap:13px;background:var(--card2);border:1px solid #262a37;border-radius:12px;padding:13px 14px;color:#e8e9ee;font:500 15px inherit;text-align:left;cursor:pointer}
.srcBtn:active{border-color:var(--acc)}
.srcBtn b{font-size:23px;line-height:1;flex:0 0 auto}
.srcBtn small{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:3px}
.pick{padding:14px;border-radius:12px;border:1px dashed #3a3f52;background:#12141c;color:var(--dim);text-align:center;font-size:14px}
.preview{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
.tip{font-size:11px;color:#5c6175;margin-top:6px}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;color:var(--txt)}
.sw input{width:20px;height:20px;accent-color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1 id="ttlRow"><span id="ttl">Топ порноактрис</span><button class="pencil" id="ttlEdit" title="Переименовать список">✎</button></h1>
  <input type="search" id="q" placeholder="Поиск…">
  <div class="chips" id="chips"></div>
</header>
<main id="grid"></main>
<button class="fab fab2" id="fabimg" title="Сохранить топ фото">⤓</button>
<button class="fab" id="fab">+</button>
<div class="toast" id="toast">Готово</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2 id="sheetTitle">Новая запись</h2>

    <label>Имя / название</label>
    <input type="text" id="f_name" placeholder="Например: Angela White">

    <label>Фото, GIF или короткий ролик</label>
    <div class="pick" id="pick">Нажми, чтобы выбрать фото или видео</div>
    <img class="preview" id="prev" alt="">
    <video class="preview" id="prevv" muted loop playsinline></video>
    <div class="tip">GIF анимируется, ролик играет на превью. Всё хранится внутри приложения, интернет не нужен.</div>

    <label>Размер сисек</label>
    <div class="sizes" id="sizes"></div>

    <div class="sw"><input type="checkbox" id="f_nat" checked><span>Натуральная</span></div>

    <label>Теги (через запятую)</label>
    <input type="text" id="f_tags" placeholder="милф, блондинка, большие">

    <div class="row">
      <button class="btn cancel" id="cancel">Отмена</button>
      <button class="btn save" id="save">Сохранить</button>
    </div>
  </div>
</div>

<div class="srcWrap" id="srcWrap">
  <div class="srcPanel">
    <h3>Откуда взять файл?</h3>
    <button class="srcBtn" id="srcPhoto"><b>🖼️</b><span>Галерея — фото<small>Снимки из галереи и Google Фото</small></span><input type="file" id="f_photo" accept="image/*"></button>
    <button class="srcBtn" id="srcVideo"><b>🎬</b><span>Галерея — видео<small>Ролики из галереи и других приложений</small></span><input type="file" id="f_video" accept="video/*"></button>
    <button class="srcBtn" id="srcGal"><b>🔥</b><span>Фото и видео сразу<small>Смешанный выбор снимков и роликов</small></span><input type="file" id="f_file" accept="image/*,video/*"></button>
    <button class="srcBtn" id="srcAny"><b>📁</b><span>Файлы и приложения<small>Проводник, Диск, мессенджеры — без фильтра</small></span><input type="file" id="f_all"></button>
  </div>
</div>

<div class="flagWrap" id="flagWrap">
  <div class="flagPanel">
    <div class="flagTop"><h3>Флаг страны</h3><input id="flagSearch" type="text" placeholder="Поиск страны"></div>
    <div id="flagGrid"></div>
  </div>
</div>
<script>
const KEY='kamrad_collection_v1';
const grid=document.getElementById('grid');
const chips=document.getElementById('chips');
const q=document.getElementById('q');
const sheet=document.getElementById('sheet');
const prev=document.getElementById('prev');
const fileIn=document.getElementById('f_file');
const anyIn=document.getElementById('f_any');
const allIn=document.getElementById('f_all');
const srcWrap=document.getElementById('srcWrap');
const sizesBox=document.getElementById('sizes');
let data=JSON.parse(localStorage.getItem(KEY)||'null');
if(!Array.isArray(data)||!data.length){
  try{ const bak=JSON.parse(localStorage.getItem(KEY+'_backup')||'null'); if(Array.isArray(bak)&&bak.length) data=bak; }catch(e){}
}
let activeTag=null, editId=null, curSize=0;
let pendingBlob=null, pendingKind='', pendURL='', pendingThumb='';
const urls=new Map();

/* ---- название списка ---- */
const TKEY='kamrad_title_v1';
const ttlEl=document.getElementById('ttl'), ttlRow=document.getElementById('ttlRow'), ttlEdit=document.getElementById('ttlEdit');
let ttlInput=null;
function applyTitle(v){
  const t=(v||'').trim()||'Топ порноактрис';
  ttlEl.textContent=t;
  document.title=t;
  try{localStorage.setItem(TKEY,t)}catch(e){}
}
function editTitle(){
  if(ttlInput)return;
  const inp=document.createElement('input');
  inp.type='text';inp.className='ttl-inp';inp.value=ttlEl.textContent;inp.maxLength=48;
  inp.setAttribute('enterkeyhint','done');
  ttlEl.style.display='none';
  ttlRow.insertBefore(inp,ttlEdit);
  ttlInput=inp;
  inp.focus();inp.select();
  const fin=save=>{
    if(!ttlInput)return;
    const v=inp.value;
    ttlInput=null;
    inp.remove();
    ttlEl.style.display='';
    if(save)applyTitle(v);
    else applyTitle(localStorage.getItem(TKEY));
  };
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();fin(true)}
    else if(e.key==='Escape'){e.preventDefault();fin(false)}
  });
  inp.addEventListener('blur',()=>fin(true));
}
ttlEdit.addEventListener('click',e=>{e.stopPropagation();editTitle()});
ttlEl.addEventListener('dblclick',editTitle);
applyTitle(localStorage.getItem(TKEY));

/* ---- хранилище медиа (IndexedDB, без лимита localStorage) ---- */
let dbp=null;
function idb(){
  if(dbp)return dbp;
  dbp=new Promise((res,rej)=>{
    if(!('indexedDB' in window)){rej(new Error('нет IndexedDB'));return}
    const r=indexedDB.open('top_media',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('m');
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return dbp;
}
async function putMedia(id,blob){
  const d=await idb();
  return new Promise((res,rej)=>{
    const tx=d.transaction('m','readwrite');
    tx.objectStore('m').put(blob,String(id));
    tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);
  });
}
async function getMedia(id){
  const d=await idb();
  return new Promise(res=>{
    const rq=d.transaction('m','readonly').objectStore('m').get(String(id));
    rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);
  });
}
async function delMedia(id){
  const u=urls.get(id);if(u){URL.revokeObjectURL(u);urls.delete(id)}
  const d=await idb();
  return new Promise(res=>{const tx=d.transaction('m','readwrite');tx.objectStore('m').delete(String(id));tx.oncomplete=res;tx.onerror=res;});
}
async function mediaURL(m){
  if(urls.has(m.id))return urls.get(m.id);
  if(!m.kind)return m.img||'';
  let b=null;
  try{b=await getMedia(m.id)}catch(e){b=null}
  if(!b)return m.img||'';
  const u=URL.createObjectURL(b);urls.set(m.id,u);return u;
}
function blobToDataURL(b){
  return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res('');r.readAsDataURL(b)});
}
async function attachMedia(holder,m){
  const url=await mediaURL(m);if(!url)return;
  const el=document.createElement(m.kind==='video'?'video':'img');
  if(m.kind==='video'){el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true;if(m.thumb)el.poster=m.thumb}
  el.src=url;
  holder.insertBefore(el,holder.firstChild);
}

if(!data){
  data=[
    {id:1,name:'Angela White',size:8,nat:true,tags:['милф','натуральная','блондинка'],note:'Эталон натуральных сисек.',img:''},
    {id:2,name:'Anissa Kate',size:7,nat:true,tags:['милф','натуральная','брюнетка'],note:'Натуральная и тяжёлая.',img:''},
    {id:3,name:'Brooke Wylde',size:8,nat:true,tags:['натуральная','рыжая'],note:'Огромная натуральная.',img:''},
    {id:4,name:'Ava Addams',size:5,nat:false,tags:['милф','силикон','брюнетка'],note:'Силикон, но аккуратный.',img:''},
    {id:5,name:'Peta Jensen',size:5,nat:false,tags:['силикон','брюнетка'],note:'Форма держится хорошо.',img:''},
    {id:6,name:'Chloe Lamour',size:5,nat:false,tags:['силикон','блондинка'],note:'Крупная для комплекции.',img:''}
  ];
  saveData();
}
/* тег «грудь» -> «сиськи» в уже сохранённых данных */
/* добавить 40 пустых позиций (один раз) */
if(!localStorage.getItem('kamrad_pad40_v1')){
  let maxId=0;data.forEach(m=>{if(+m.id>maxId)maxId=+m.id});
  for(let i=1;i<=40;i++){
    data.push({id:maxId+i,name:'Позиция '+(data.length+1),size:0,nat:true,tags:[],flag:'',img:''});
  }
  saveData();
  try{localStorage.setItem('kamrad_pad40_v1','1')}catch(e){}
}

if(Array.isArray(data)){let ch=false;data.forEach(m=>{if(Array.isArray(m.tags)){m.tags=m.tags.map(t=>{if(/^груд[ьи]$/i.test(t.trim())||/^груд/i.test(t.trim())){ch=true;return 'сиськи'}return t})}});if(ch)localStorage.setItem(KEY,JSON.stringify(data))}
function saveData(){
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
    localStorage.setItem(KEY+'_backup',JSON.stringify(data));
  }catch(e){alert('Память переполнена — удали пару фото')}
}

for(let i=1;i<=8;i++){
  const b=document.createElement('button');
  b.className='sz';b.textContent=i;b.dataset.v=i;
  b.onclick=()=>{curSize=i;refreshSizes()};
  sizesBox.appendChild(b);
}
function refreshSizes(){[...sizesBox.children].forEach(b=>b.classList.toggle('on',+b.dataset.v===curSize))}

function safeRender(){ try{ render() }catch(err){ console.warn('render error',err) } }
window.addEventListener('error',e=>{ try{ if(!document.querySelector('#grid .card')) safeRender() }catch(_){} });
function render(){
  const term=q.value.trim().toLowerCase();
  const tags=[...new Set(data.flatMap(m=>m.tags||[]))].sort();
  chips.innerHTML='';
  tags.forEach(t=>{
    const c=document.createElement('div');
    c.className='chip'+(activeTag===t?'':'');
    c.textContent=t;
    if(activeTag===t){c.style.background='var(--acc)';c.style.color='#fff';c.style.borderColor='var(--acc)'}
    c.onclick=()=>{activeTag=(activeTag===t?null:t);render()};
    chips.appendChild(c);
  });
  const list=data.filter(m=>{
    const okTag=!activeTag||(m.tags||[]).includes(activeTag);
    const hay=(m.name+' '+(m.tags||[]).join(' ')).toLowerCase();
    return okTag&&(!term||hay.includes(term));
  });
  grid.innerHTML='';
  if(!list.length){
    grid.innerHTML='<div class="empty">Пусто.<br>Нажми <b>+</b> внизу и добавь первую запись.</div>';
    return;
  }
  list.forEach(m=>{
    const card=document.createElement('div');
    card.className='card';
    card.dataset.id=m.id;
    const rank=data.indexOf(m)+1;
    const ini=(m.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    card.innerHTML=`
      <div class="shot">
        <div class="ini">${ini}</div>${m.kind==='video'?'<div class="badge">▶ видео</div>':m.kind==='gif'?'<div class="badge">GIF</div>':''}
        <button class="flagSel" title="Флаг страны">${m.flag||'🏳️'}</button>
        <div class="size">${m.size?m.size+'-й':'—'}</div>
        <div class="num">${rank}</div>
      </div>
      <div class="body">

/* ==== перетаскивание карточек: плавное, с живой перенумерацией ==== */
let dg=null, dgBlockClick=false, dgY=0;
function dragFiltered(){return !!q.value.trim()||!!activeTag}
function dragHintOnce(){
  if(data.length<2||localStorage.getItem('hintDrag'))return;
  localStorage.setItem('hintDrag','1');
  setTimeout(()=>toast('Зажми карточку и тащи — номера пересчитаются'),700);
}
function applyOrderFromDOM(){
  const ids=[...grid.querySelectorAll('.card')].map(c=>c.dataset.id);
  if(ids.length!==data.length)return;
  const byId=new Map(data.map(m=>[String(m.id),m]));
  if(ids.some(id=>!byId.has(id)))return;
  data=ids.map(id=>byId.get(id));
  [...grid.querySelectorAll('.card')].forEach((c,i)=>{
    const n=c.querySelector('.num'); if(n)n.textContent=i+1;
  });
}
function liveOrder(){
  if(!dg)return null;
  const byId=new Map(data.map(m=>[String(m.id),m]));
  const order=[];
  for(const n of grid.children){
    if(n===dg.ph){
      const m=byId.get(dg.card.dataset.id); if(m)order.push(m);
      continue;
    }
    if(n===dg.card)continue;
    if(n.classList&&n.classList.contains('card')){
      const m=byId.get(n.dataset.id); if(m)order.push(m);
    }
  }
  return order.length===data.length?order:null;
}
function renumberLive(){
  const order=liveOrder(); if(!order)return;
  const num=new Map();
  order.forEach((m,i)=>num.set(String(m.id),i+1));
  grid.querySelectorAll('.card').forEach(c=>{
    const n=c.querySelector('.num');
    if(n&&num.has(c.dataset.id))n.textContent=num.get(c.dataset.id);
  });
}
function animShift(mutate){
  const els=[...grid.children].filter(el=>el!==dg.card&&el!==dg.ph);
  const before=new Map(els.map(el=>[el,el.getBoundingClientRect()]));
  mutate();
  els.forEach(el=>{
    const a=before.get(el), b=el.getBoundingClientRect();
    const dx=a.left-b.left, dy=a.top-b.top;
    if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5)return;
    el.style.transition='none';
    el.style.transform='translate3d('+dx+'px,'+dy+'px,0)';
    void el.offsetWidth;
    el.style.transition='transform .2s cubic-bezier(.22,.8,.24,1)';
    el.style.transform='';
  });
}
function moveGhost(x,y){
  if(!dg||!dg.active)return;
  dg.card.style.transform='translate3d('+(x-dg.sx)+'px,'+(y-dg.sy)+'px,0) scale(1.04)';
}
function startDrag(px,py){
  if(!dg||dg.active)return;
  dg.active=true;
  const card=dg.card, r=card.getBoundingClientRect();
  dg.sx=px;dg.sy=py;dg.lastX=px;dg.lastY=py;
  dg.ph=document.createElement('div');
  dg.ph.className='ph';
  dg.ph.style.height=r.height+'px';
  grid.insertBefore(dg.ph,card);
  card.classList.remove('press');
  card.classList.add('dragging');
  card.style.width=r.width+'px';
  card.style.height=r.height+'px';
  card.style.left=r.left+'px';
  card.style.top=r.top+'px';
  dgBlockClick=true;
  document.body.classList.add('dragging-mode');
  if(navigator.vibrate)navigator.vibrate(12);
  moveGhost(px,py);
  cancelAnimationFrame(dg.raf);
  dg.raf=requestAnimationFrame(autoScroll);
}
function autoScroll(){
  if(!dg||!dg.active)return;
  const y=dg.lastY||0, vh=innerHeight;
  let d=0;
  if(y<120)d=-Math.min(1,(120-y)/120)*17;
  else if(y>vh-140)d=Math.min(1,(y-(vh-140))/140)*17;
  if(d){window.scrollBy(0,d);moveGhost(dg.lastX,dg.lastY)}
  dg.raf=requestAnimationFrame(autoScroll);
}
function dragMove(x,y){
  if(!dg||!dg.active)return;
  dg.lastX=x;dg.lastY=y;
  moveGhost(x,y);
  const el=document.elementFromPoint(x,y);
  if(!el)return;
  const over=el.closest('.card');
  if(!over||!grid.contains(over)||over===dg.card)return;
  const r=over.getBoundingClientRect();
  let before;
  if(y<r.top+r.height*0.3)before=true;
  else if(y>r.top+r.height*0.7)before=false;
  else before=x<r.left+r.width/2;
  const others=[...grid.children].filter(n=>n!==dg.card&&n!==dg.ph);
  const oi=others.indexOf(over);if(oi<0)return;
  const want=before?oi:oi+1;
  let curPos=0;
  for(const n of grid.children){
    if(n===dg.ph)break;
    if(n!==dg.card)curPos++;
  }
  if(curPos===want)return;
  const ref=others[want]||null;
  animShift(()=>{ if(ref)grid.insertBefore(dg.ph,ref); else grid.appendChild(dg.ph) });
  renumberLive();
}
function endDrag(){
  if(!dg)return;
  clearTimeout(dg.timer);
  if(dg.active){
    cancelAnimationFrame(dg.raf);
    const card=dg.card, ph=dg.ph;
    card.classList.remove('dragging');
    card.style.cssText='';
    if(ph){grid.insertBefore(card,ph);ph.remove()}
    applyOrderFromDOM();
    saveData();
    document.body.classList.remove('dragging-mode');
    setTimeout(()=>{
      [...grid.children].forEach(el=>{el.style.transition='';el.style.transform=''});
      dgBlockClick=false;
    },220);
  }
  dg=null;
}
document.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const card=e.target.closest('.card');
  if(!card||!grid.contains(card))return;
  if(e.target.closest('.del')||e.target.closest('.flagSel'))return;
  if(dragFiltered()){toast('Сбрось поиск и фильтр, чтобы менять порядок');return}
  dg={card,sx:e.clientX,sy:e.clientY,lastX:e.clientX,lastY:e.clientY,active:false,touch:e.pointerType!=='mouse',timer:null,raf:0,ph:null};
  if(dg.touch){
    dg.timer=setTimeout(()=>{if(dg&&!dg.active)startDrag(dg.lastX,dg.lastY)},230);
  }
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!dg)return;
  dg.lastX=e.clientX;dg.lastY=e.clientY;
  if(!dg.active){
    const d=Math.hypot(e.clientX-dg.sx,e.clientY-dg.sy);
    if(dg.touch){
      if(d>9){clearTimeout(dg.timer);dg.card.classList.remove('press');dg=null}
      return;
    }
    if(d<6)return;
    startDrag(e.clientX,e.clientY);
    if(!dg||!dg.active)return;
  }
  if(e.cancelable)e.preventDefault();
  dragMove(e.clientX,e.clientY);
},{passive:false});
document.addEventListener('pointerup',()=>endDrag(),{passive:true});
document.addEventListener('pointercancel',()=>endDrag(),{passive:true});
document.addEventListener('touchmove',e=>{if(dg&&dg.active&&e.cancelable)e.preventDefault()},{passive:false});

/* ==== флаг: обрезка по контуру и растяжка на весь квадрат ==== */
const flagUrlCache=new Map(), flagGlyphCache=new Map();
function flagGlyph(v){
  if(flagGlyphCache.has(v))return flagGlyphCache.get(v);
  let res=null;
  try{
    const S=192,cv=document.createElement('canvas');cv.width=cv.height=S;
    const cx=cv.getContext('2d');
    cx.font='400 170px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",Arial';
    cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(v,S/2,S/2);
    const d=cx.getImageData(0,0,S,S).data;
    let x0=S,y0=S,x1=-1,y1=-1;
    for(let y=0;y<S;y++)for(let x=0;x<S;x++){
      if(d[(y*S+x)*4+3]>8){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    }
    if(x1>x0&&y1>y0) res={cv:cv,x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
  }catch(e){res=null}
  flagGlyphCache.set(v,res);return res;
}
function flagBg(v){
  if(!v)return '';
  if(flagUrlCache.has(v))return flagUrlCache.get(v);
  let url='';
  try{
    const g=flagGlyph(v);
    if(g){
      const out=document.createElement('canvas');out.width=g.w;out.height=g.h;
      out.getContext('2d').drawImage(g.cv,g.x,g.y,g.w,g.h,0,0,g.w,g.h);
      url=out.toDataURL('image/png');
    }
  }catch(e){}
  flagUrlCache.set(v,url);return url;
}
function drawFlagFill(c,v,dx,dy,size){
  const g=flagGlyph(v);
  if(g){ c.drawImage(g.cv,g.x,g.y,g.w,g.h,dx,dy,size,size); return; }
  c.textAlign='center';c.textBaseline='middle';
  c.font='400 '+Math.round(size*0.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",Arial';
  c.fillStyle='#ffffff';c.fillText(v,dx+size/2,dy+size/2+1);
  c.textBaseline='alphabetic';c.textAlign='left';
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function compressImg(f,max=900,q=0.82){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,hh=img.height;
        if(w>hh&&w>max){hh=Math.round(hh*max/w);w=max}
        else if(hh>=w&&hh>max){w=Math.round(w*max/hh);hh=max}
        const c=document.createElement('canvas');c.width=w;c.height=hh;
        c.getContext('2d').drawImage(img,0,0,w,hh);
        c.toBlob(b=>res(b||f),'image/jpeg',q);
      };
      img.onerror=()=>res(f);
      img.src=r.result;
    };
    r.onerror=()=>res(f);
    r.readAsDataURL(f);
  });
}

async function acceptPicked(f){
  if(!f)return;
  const okType=/^(image|video)\//.test(f.type)||/\.(mp4|webm|mov|m4v|mkv|gif|jpe?g|png|webp|heic|heif|avif|bmp)$/i.test(f.name);
  if(!okType){toast('Это не фото и не видео');return}
  if(pendURL){URL.revokeObjectURL(pendURL);pendURL=''}
  const isVideo=/^video\//.test(f.type)||/\.(mp4|webm|mov|m4v|mkv)$/i.test(f.name);
  const isGif=f.type==='image/gif'||/\.gif$/i.test(f.name);
  const pickEl=document.getElementById('pick');
  if(isVideo){
    if(f.size>100*1024*1024){toast('Ролик больше 100 МБ — телефону будет тяжело');}
    pendingBlob=f;pendingKind='video';
    pendURL=URL.createObjectURL(f);
    showPreview(pendURL,'video');
    pendingThumb='';
    thumbFromVideo(prevv).then(t=>{if(pendingKind==='video'&&pendURL) pendingThumb=t});
    pickEl.textContent='Ролик выбран — нажми, чтобы заменить';
    return;
  }
  if(isGif){
    if(f.size>20*1024*1024){toast('GIF большой, будет подтормаживать')}
    pendingBlob=f;pendingKind='gif';
    pendURL=URL.createObjectURL(f);
    showPreview(pendURL,'gif');
    pickEl.textContent='GIF выбран — нажми, чтобы заменить';
    return;
  }
  pickEl.textContent='Обрабатываю…';
  const b=await compressImg(f);
  pendingBlob=b;pendingKind='img';
  pendURL=URL.createObjectURL(b);
  showPreview(pendURL,'img');
  pickEl.textContent='Фото выбрано — нажми, чтобы заменить';
}
function wirePick(el){
  el.onchange=()=>{
    const f=el.files[0];el.value='';
    closeSrc();
    if(f)acceptPicked(f);
  };
}

  }catch(e){
    alert('Не удалось сохранить файл: '+e.message);
    btn.disabled=false;return;
  }
  if(editId)data=data.map(x=>x.id===editId?obj:x);else data.push(obj);
  btn.disabled=false;
  saveData();pendingBlob=null;if(pendURL){URL.revokeObjectURL(pendURL);pendURL=''}
  closeForm();render();
};


function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);
}

function once(el,ev,ms){
  return new Promise(res=>{
    let done=false;
    const fin=()=>{if(done)return;done=true;el.removeEventListener(ev,fin);res(true)};
    el.addEventListener(ev,fin);
    setTimeout(fin,ms||4000);
  });
}
function frameToDataURL(src,maxW){
  const W=maxW||480;
  const vw=src.videoWidth||src.width||W, vh=src.videoHeight||src.height||W;
  const k=Math.min(1,W/vw);
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(vw*k));c.height=Math.max(1,Math.round(vh*k));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  try{return c.toDataURL('image/jpeg',0.8)}catch(e){return ''}
}
/* кадр из ролика: ждём данные, отматываем на 0.6с, снимаем jpeg */
async function thumbFromVideo(v){
  if(!v)return '';
  if(v.readyState<2){
    try{v.load()}catch(e){}
    await once(v,'loadeddata',5000);
  }
  if(v.readyState<2)await once(v,'canplay',3000);
  if(v.readyState<2)return '';
  const dur=isFinite(v.duration)&&v.duration>0?v.duration:0;
  const t=dur?Math.min(0.6,dur/3):0;
  if(t>0){
    try{v.currentTime=t}catch(e){}
    await once(v,'seeked',2500);
  }
  if(v.readyState<2)return '';
  try{return frameToDataURL(v,480)}catch(e){return ''}
}
async function loadFrame(m){
  if(m.kind==='video'&&m.thumb){const t=await loadImg(m.thumb);if(t)return t}
  let url='';
  try{url=await mediaURL(m)}catch(e){url=m.img||''}
  if(!url)return null;
  if(m.kind==='video')return await videoFrame(url);
  return await loadImg(url);
}
async function videoFrame(url){
  const v=document.createElement('video');
  v.muted=true;v.playsInline=true;v.preload='auto';
  v.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0';
  document.body.appendChild(v);
  v.src=url;
  const th=await thumbFromVideo(v);
  v.pause();v.removeAttribute('src');try{v.load()}catch(e){}
  v.remove();
  if(!th)return null;
  return await loadImg(th);
}
function loadImg(src){
  return new Promise(res=>{
    if(!src)return res(null);
    const im=new Image();
    im.onload=()=>res(im);
    im.onerror=()=>res(null);
    im.src=src;
  });
}

async function makePoster(){
  const list=data.slice();
  if(!list.length){toast('Список пуст');return}

  const W=1080, M=30, GAP=12, COLS=5;
  const colW=Math.floor((W-M*2-GAP*(COLS-1))/COLS);
  const imgH=Math.floor(colW*4/3);
  const textH=92;
  const cardH=imgH+textH;
  const headH=150, footH=0;
  const rows=Math.ceil(list.length/COLS);
  const H=headH+rows*(cardH+GAP)-GAP+M+footH;

  const cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  const c=cv.getContext('2d');

  // background
  const bg=c.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#12141c');bg.addColorStop(1,'#0a0b0f');
  c.fillStyle=bg;c.fillRect(0,0,W,H);

  // header
  c.textAlign='left';c.textBaseline='alphabetic';
  c.font='700 52px Impact, Arial';
  c.fillStyle='#ffffff';
  c.fillText(fit(c,(ttlEl.textContent||'Топ порноактрис').toUpperCase(),W-M*2,52), M, M+58);
  c.font='400 24px Arial';
  c.fillStyle='#8a8fa3';
  c.fillText(list.length+' позиций · размер сисек цифрой · личный рейтинг', M, M+96);
  c.fillStyle='#2f7bff';
  c.fillRect(M, M+112, 90, 5);

  const imgs=await Promise.all(list.map(m=>loadFrame(m)));

  list.forEach((m,i)=>{
    const r=Math.floor(i/COLS), k=i%COLS;
    const x=M+k*(colW+GAP);
    const y=headH+r*(cardH+GAP);

    // card bg
    c.save();
    roundRect(c,x,y,colW,cardH,0);
    c.fillStyle='#171923';c.fill();
    c.strokeStyle='#262a37';c.lineWidth=2;c.stroke();
    c.restore();

    // photo area
    c.save();
    roundRect(c,x,y,colW,imgH,0);
    c.clip();
    const im=imgs[i];
    if(im){
      const s=Math.max(colW/im.width, imgH/im.height);
      const dw=im.width*s, dh=im.height*s;
      c.drawImage(im, x+(colW-dw)/2, y+(imgH-dh)/2, dw, dh);
    }else{
      const g=c.createLinearGradient(x,y,x+colW,y+imgH);
      g.addColorStop(0,'#2a2f42');g.addColorStop(1,'#14161f');
      c.fillStyle=g;c.fillRect(x,y,colW,imgH);
      const ini=(m.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      c.fillStyle='#3d4358';c.font='700 46px Impact, Arial';c.textAlign='center';
      c.fillText(ini, x+colW/2, y+imgH/2+16);
    }
    // number badge
    c.fillStyle='rgba(0,0,0,.82)';
    c.fillRect(x, y+imgH-38, 38, 38);
    c.textAlign='center';c.textBaseline='middle';
    c.fillStyle='#ffffff';c.font='700 18px Impact, Arial';
    c.fillText(String(i+1), x+19, y+imgH-18);
    c.textAlign='left';c.textBaseline='alphabetic';
    if(m.flag){
      const FS=58;
      c.fillStyle='rgba(0,0,0,.55)';
      c.fillRect(x+colW-FS, y, FS, FS);
      drawFlagFill(c,m.flag,x+colW-FS,y,FS);
    }
    // size badge — правый нижний угол фото, квадрат
    if(m.size){
      const ss=38;
      c.fillStyle='rgba(0,0,0,.82)';
      c.fillRect(x+colW-ss, y+imgH-ss, ss, ss);
      c.textAlign='center';c.textBaseline='middle';
      c.font='700 17px Arial';c.fillStyle='#3ddc84';
      c.fillText(m.size+'-й', x+colW-ss/2, y+imgH-ss/2+1);
      c.textAlign='left';c.textBaseline='alphabetic';
    }
    c.restore();

    // texts
    c.textAlign='left';
    c.fillStyle='#e8e9ee';c.font='700 19px Arial';
    c.fillText(fit(c,m.name||'',colW-22,19), x+11, y+imgH+27);
    c.font='400 15px Arial';
    c.fillStyle=m.nat?'#3ddc84':'#8a8fa3';
    c.fillText(m.nat?'натуральная':'силикон', x+11, y+imgH+49);
    if((m.tags||[]).length){
      c.fillStyle='#8a8fa3';c.font='400 13px Arial';
      c.fillText(fit(c,(m.tags||[]).join(' · '),colW-22,13), x+11, y+imgH+70);
    }
  });

  return await new Promise(res=>cv.toBlob(b=>res(b),'image/png'));
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function fit(c,str,maxW,size){
  if(c.measureText(str).width<=maxW)return str;
  let s=str;
  while(s.length>3&&c.measureText(s+'…').width>maxW)s=s.slice(0,-1);
  return s+'…';
}

document.getElementById('fabimg').onclick=async()=>{
  const btn=document.getElementById('fabimg');
  btn.disabled=true;toast('Собираю картинку…');
  try{
    const blob=await makePoster();
    if(!blob){toast('Не получилось');return}
    const file=new File([blob],'top-pornoaktris.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:ttlEl.textContent});
        toast('Готово');return;
      }catch(e){/* user cancelled -> fallback download */}
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='top-pornoaktris.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('Сохранено в Загрузки');
  }catch(e){
    toast('Ошибка: '+e.message);
  }finally{btn.disabled=false}
};

q.addEventListener('input',render);
render();
